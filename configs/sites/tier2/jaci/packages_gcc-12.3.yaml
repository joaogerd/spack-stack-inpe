# JACI packages_gcc-12.3.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define package externals and package preferences specific to the validated
# JACI GNU 12.3 target.
#
# Context
# -------
# This file follows the JCSDA spack-stack site convention and belongs under:
#
#   configs/sites/tier2/jaci/packages_gcc-12.3.yaml
#
# JACI uses CrayPE. The compiler backend is provided by `gcc-native/12.3`, but
# packages that require MPI must still use the CrayPE drivers:
#
#   cc   for C
#   CC   for C++
#   ftn  for Fortran
#
# Do not force packages to use raw Cray MPICH wrappers such as `mpicc`,
# `mpicxx` or `mpifort` when CrayPE is loaded.
#
# Validation status
# -----------------
# This target is the currently validated JACI baseline:
#
#   PrgEnv-gnu/8.6.0
#   gcc-native/12.3
#   craype-x86-turin
#   cray-mpich/8.1.31
#   libfabric/1.22.0
#   cray-pals/1.6.1
#
# This baseline successfully supported a reduced MPAS-JEDI build and PBS/PALS
# test execution, with 61/62 MPAS-JEDI tests passing and one stable numerical
# reference mismatch in `mpasjedi_lgetkf_height_vloc`.
#
# How to use
# ----------
# Use this file together with the common `packages.yaml` from this same site
# directory. It should be copied into the JCSDA spack-stack tree as part of the
# full JACI site directory.
#
# Open items
# ----------
# 1. Confirm whether all entries below are picked up exactly as expected by
#    spack-stack release/2.1 after migration from the discovery tree.
# 2. Decide whether BLAS/LAPACK should remain OpenBLAS, as in the validated
#    flow, or whether Cray LibSci should be evaluated in a separate experiment.

packages:
  c:
    require:
      - one_of:
          - gcc@12.3.0

  cxx:
    require:
      - one_of:
          - gcc@12.3.0

  fortran:
    require:
      - one_of:
          - gcc@12.3.0

  gcc:
    buildable: false
    require:
      - one_of:
          - gcc@12.3.0 languages='c,c++,fortran'
    externals:
      - spec: gcc@12.3.0 languages:='c,c++,fortran'
        prefix: /opt/cray/pe/gcc-native/12
        modules:
          - PrgEnv-gnu/8.6.0
          - gcc-native/12.3
          - craype-x86-turin
        extra_attributes:
          compilers:
            c: /opt/cray/pe/gcc-native/12/bin/gcc
            cxx: /opt/cray/pe/gcc-native/12/bin/g++
            fortran: /opt/cray/pe/gcc-native/12/bin/gfortran

  mpi:
    buildable: false
    require:
      - one_of:
          - cray-mpich@8.1.31+wrappers

  openmpi:
    buildable: false

  mpich:
    buildable: false

  cray-mpich:
    buildable: false
    variants: +wrappers
    require:
      - one_of:
          - cray-mpich@8.1.31+wrappers
    externals:
      - spec: cray-mpich@8.1.31+wrappers
        prefix: /opt/cray/pe/mpich/8.1.31/ofi/gnu/12.3
        modules:
          - PrgEnv-gnu/8.6.0
          - gcc-native/12.3
          - craype-x86-turin
          - cray-mpich/8.1.31
          - libfabric/1.22.0
          - cray-pals/1.6.1
        extra_attributes:
          environment:
            set:
              MPICC: /opt/cray/pe/craype/2.7.33/bin/cc
              MPICXX: /opt/cray/pe/craype/2.7.33/bin/CC
              MPIFC: /opt/cray/pe/craype/2.7.33/bin/ftn
              MPIF77: /opt/cray/pe/craype/2.7.33/bin/ftn
              MPIF90: /opt/cray/pe/craype/2.7.33/bin/ftn
