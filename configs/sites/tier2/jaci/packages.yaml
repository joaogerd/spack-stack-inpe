# Common JACI packages.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define compiler-independent package preferences for the JACI site.
# Compiler-specific externals must be placed in files such as:
#
#   packages_gcc-13.2.yaml
#
# Context
# -------
# JACI uses CrayPE and Cray MPICH. The MPI provider for the target stack should
# be `cray-mpich`, but the actual external prefix depends on the loaded GNU
# backend and therefore belongs in the compiler-specific package file.
#
# Validation status
# -----------------
# This is an initial skeleton. The provider choice reflects the validated
# CrayPE/Cray MPICH strategy from the discovery workflow. Additional providers,
# especially BLAS/LAPACK through Cray LibSci, are not enabled here until they
# are explicitly validated for the target stack.
#
# How to use
# ----------
# Keep this file for generic preferences that apply to all compiler targets on
# JACI. Do not add package paths here if they depend on gcc-native/12.3,
# gcc-native/13.2 or another backend.
#
# Open items
# ----------
# 1. Confirm if Cray LibSci should be used as BLAS/LAPACK provider.
# 2. Confirm if any packages should be globally non-buildable.
# 3. Keep NetCDF, HDF5, PIO and related scientific libraries buildable unless
#    they are intentionally validated as externals.

packages:
  all:
    require: []
    providers:
      mpi: [cray-mpich]

  # TODO: confirm whether Cray LibSci should be used as BLAS/LAPACK provider
  # for the final GCC 13.2 target. Do not enable before validation.
  # all:
  #   providers:
  #     blas: [cray-libsci]
  #     lapack: [cray-libsci]
