# Common JACI packages.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define compiler-independent package preferences for the JACI site.
# Compiler-specific externals must be placed in files such as:
#
#   packages_gcc-12.3.yaml
#   packages_gcc-13.2.yaml
#
# Context
# -------
# JACI uses CrayPE and Cray MPICH. The MPI provider for the validated target is
# `cray-mpich`. The actual Cray MPICH external prefix depends on the compiler
# backend and therefore belongs in the compiler-specific package file.
#
# Validation status
# -----------------
# The validated JACI baseline uses gcc-native/12.3 and cray-mpich/8.1.31. The
# newer gcc-native/13.2 target is not currently production-ready because the
# loaded Cray MPICH module still points to the GNU 12.3 MPICH backend.
#
# How to use
# ----------
# Keep this file for generic preferences that apply to all compiler targets on
# JACI. Do not add package paths here if they depend on gcc-native/12.3,
# gcc-native/13.2 or another backend.
#
# Open items
# ----------
# 1. Confirm whether BLAS/LAPACK should remain OpenBLAS, as used in the
#    validated flow, or whether Cray LibSci should be evaluated separately.
# 2. Confirm whether any additional packages should be globally non-buildable.
# 3. Keep NetCDF, HDF5, PIO and related scientific libraries buildable unless
#    they are intentionally validated as externals.

packages:
  all:
    require: []
    providers:
      mpi: [cray-mpich]
      blas: [openblas]
      lapack: [openblas]

  openmpi:
    buildable: false

  mpich:
    buildable: false

  # Cray LibSci is intentionally not enabled here. The validated flow used
  # OpenBLAS. Cray LibSci should be evaluated only in a separate experiment.
