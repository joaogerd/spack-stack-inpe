# JACI config.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define site-level Spack configuration for the JACI machine, following the
# JCSDA spack-stack site layout:
#
#   configs/sites/tier2/jaci/config.yaml
#
# Context
# -------
# This file belongs to the INPE/JACI site configuration. It should be copied
# into the JCSDA spack-stack tree under the same relative path before creating
# and concretizing the target environment.
#
# Validation status
# -----------------
# This is an initial skeleton. It is not yet a production-ready JACI config.
# The GCC 12.3 diagnostic baseline was validated in the discovery workflow, but
# the target configuration for this repository is GCC 13.2 and still needs a
# full validation run.
#
# How to use
# ----------
# Copy the full site directory into the JCSDA spack-stack tree:
#
#   cp -r configs/sites/tier2/jaci <spack-stack>/configs/sites/tier2/
#
# Then activate/create the intended spack-stack environment and inspect with:
#
#   spack config blame config
#
