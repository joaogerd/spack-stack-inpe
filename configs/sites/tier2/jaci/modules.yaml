# JACI modules.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define the module generation policy for the JACI site.
#
# Context
# -------
# The validated JACI stack used Tcl modulefiles, not Lmod. The generated module
# tree was rooted under the active Spack environment:
#
#   $env/modules
#
# The validated module layout used hierarchical projections based on compiler
# and MPI provider.
#
# Validation status
# -----------------
# This file follows the module style observed in the validated GCC 12.3 JACI
# stack. It should be revalidated after migrating the site configuration into
# this repository and regenerating modules from a clean spack-stack tree.
#
# How to use
# ----------
# After installing the environment, regenerate modulefiles with:
#
#   spack module tcl refresh -y
#
# Then inspect:
#
#   find $SPACK_ENV/modules -type f | sort
#   module use $SPACK_ENV/modules
#   module avail
#
# Open items
# ----------
# 1. Confirm that spack-stack release/2.1 still generates the expected Tcl
#    hierarchy from this file after migration.
# 2. Confirm whether Lmod should be evaluated later as a separate experiment.
# 3. Confirm that generated modulefiles do not reference missing dependency
#    module names.

modules:
  default:
    enable:
      - tcl
    roots:
      tcl: $env/modules
    tcl:
      projections:
        ^mpi: '{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{name}/{version}'
        all: '{compiler.name}/{compiler.version}/{name}/{version}'
      hash_length: 0
      all:
        autoload: direct
        environment:
          set:
            '{name}_ROOT': '{prefix}'
