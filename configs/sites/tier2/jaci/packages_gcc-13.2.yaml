# JACI packages_gcc-13.2.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define package externals and package preferences that are specific to the
# JACI GNU 13.2 target.
#
# Context
# -------
# On JACI, Cray MPICH is provided by the HPE/Cray programming environment.
# The exact Cray MPICH prefix depends on the GNU backend exposed by the CrayPE
# module tree.
#
# The GCC 13 compiler directory was confirmed on JACI:
#
#   /opt/cray/pe/gcc-native/13/bin/gcc      -> /usr/bin/gcc-13
#   /opt/cray/pe/gcc-native/13/bin/g++      -> /usr/bin/g++-13
#   /opt/cray/pe/gcc-native/13/bin/gfortran -> /usr/bin/gfortran-13
#
# However, the expected Cray MPICH GNU 13.2 prefix was not found:
#
#   /opt/cray/pe/mpich/8.1.31/ofi/gnu/13.2
#
# Therefore this file must not register a GCC 13.2 Cray MPICH external until
# the real prefix used by the loaded modules is identified.
#
# The build logic must still use the CrayPE compiler drivers `cc`, `CC` and
# `ftn`, not raw `mpicc`, `mpicxx` or `mpifort` wrappers.
#
# Validation status
# -----------------
# This file is a documented GCC 13.2 skeleton. It is not production-ready.
# The CrayPE/Cray MPICH strategy was validated during the GCC 12.3 diagnostic
# baseline, but the GCC 13.2 target is blocked until the Cray MPICH prefix for
# this compiler target is confirmed.
#
# How to use
# ----------
# Use this file together with the common `packages.yaml` in the same site
# directory. Before concretizing, replace the commented Cray MPICH block below
# with the actual prefix reported by the JACI module environment.
#
# Recommended verification commands on JACI:
#
#   module purge
#   module load PrgEnv-gnu/8.6.0
#   module load craype-x86-turin
#   module load cray-mpich/8.1.31
#   module load libfabric/1.22.0
#   module load cray-pals/1.6.1
#   module list
#   echo $CRAY_MPICH_DIR
#   echo $CRAY_MPICH_PREFIX
#   find /opt/cray/pe/mpich/8.1.31/ofi/gnu -maxdepth 2 -type d -print
#
# Open items
# ----------
# 1. Confirm the real Cray MPICH prefix for the GCC 13.2 module environment.
# 2. Confirm whether Cray MPICH built for GNU 12.3 is the only available GNU
#    backend and whether it is acceptable to use it with gcc-native/13.2.
# 3. Verify the correct Cray LibSci path for GNU 13 before enabling it.
# 4. Confirm whether Cray LibSci should provide BLAS/LAPACK or whether those
#    should remain built by Spack.
# 5. Confirm the exact GCC version string expected by Spack, e.g. gcc@13.2.0.

packages:
  c:
    require:
      - one_of:
          - gcc@13.2.0

  cxx:
    require:
      - one_of:
          - gcc@13.2.0

  fortran:
    require:
      - one_of:
          - gcc@13.2.0

  gcc:
    buildable: false
    require:
      - one_of:
          - gcc@13.2.0 languages='c,c++,fortran'
    externals:
      - spec: gcc@13.2.0 languages:='c,c++,fortran'
        prefix: /opt/cray/pe/gcc-native/13
        modules:
          - PrgEnv-gnu/8.6.0
          - gcc-native/13.2
          - craype-x86-turin
        extra_attributes:
          compilers:
            c: /opt/cray/pe/gcc-native/13/bin/gcc
            cxx: /opt/cray/pe/gcc-native/13/bin/g++
            fortran: /opt/cray/pe/gcc-native/13/bin/gfortran

  libfabric:
    buildable: false
    externals:
      - spec: libfabric@1.22.0%gcc@13.2.0
        prefix: /opt/cray/libfabric/1.22.0
        modules:
          - libfabric/1.22.0

  # IMPORTANT:
  # The Cray MPICH external for gcc@13.2.0 is intentionally commented out
  # because `/opt/cray/pe/mpich/8.1.31/ofi/gnu/13.2` does not exist on JACI.
  # Do not enable this block until the real prefix is confirmed.
  #
  # mpi:
  #   buildable: false
  #   require:
  #     - one_of:
  #         - cray-mpich@8.1.31+wrappers
  #
  # openmpi:
  #   buildable: false
  #
  # mpich:
  #   buildable: false
  #
  # cray-mpich:
  #   buildable: false
  #   variants: +wrappers
  #   require:
  #     - one_of:
  #         - cray-mpich@8.1.31+wrappers
  #   externals:
  #     - spec: cray-mpich@8.1.31+wrappers
  #       prefix: /path/to/confirmed/cray-mpich/prefix
  #       modules:
  #         - PrgEnv-gnu/8.6.0
  #         - gcc-native/13.2
  #         - craype-x86-turin
  #         - cray-mpich/8.1.31
  #         - libfabric/1.22.0
  #         - cray-pals/1.6.1
  #       extra_attributes:
  #         environment:
  #           set:
  #             MPICC: /opt/cray/pe/craype/2.7.33/bin/cc
  #             MPICXX: /opt/cray/pe/craype/2.7.33/bin/CC
  #             MPIFC: /opt/cray/pe/craype/2.7.33/bin/ftn
  #             MPIF77: /opt/cray/pe/craype/2.7.33/bin/ftn
  #             MPIF90: /opt/cray/pe/craype/2.7.33/bin/ftn

