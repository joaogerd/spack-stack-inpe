# JACI MPAS-JEDI spack.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define the target spack-stack environment for MONAN/MPAS-JEDI on JACI using
# the GCC 13.2 + Cray MPICH stack.
#
# Context
# -------
# This environment is meant to be copied into the JCSDA `spack-stack` tree and
# concretized there, after the JACI site configuration has been installed under:
#
#   configs/sites/tier2/jaci/
#
# Validation status
# -----------------
# This is an initial skeleton. It is not yet the final environment used for a
# validated GCC 13.2 stack. The previous discovery workflow validated a GCC 12.3
# diagnostic baseline with MPAS-JEDI 61/62 CTest results.
#
# How to use
# ----------
# Copy this file into a JCSDA spack-stack environment directory, activate it and
# concretize manually:
#
#   mkdir -p <spack-stack>/envs/jaci-mpas-jedi-gcc13-craympich
#   cp spack.yaml <spack-stack>/envs/jaci-mpas-jedi-gcc13-craympich/spack.yaml
#   spack env activate <spack-stack>/envs/jaci-mpas-jedi-gcc13-craympich
#   spack concretize -f
#
# Open items
# ----------
# 1. Replace the specs below with the exact spack-stack environment used for
#    the final GCC 13.2 validation.
# 2. Confirm whether the target environment should be named `jedi-mpas-env`,
#    `mpas-jedi-env` or another institutional name.
# 3. Confirm all variants required by MONAN/MPAS-JEDI.

spack:
  concretizer:
    unify: true

  view: false

  specs:
    # TODO: replace with the final spack-stack environment specification.
    # The placeholder below records the intended target only.
    - jedi-mpas-env%gcc@13.2.0 ^cray-mpich@8.1.31
