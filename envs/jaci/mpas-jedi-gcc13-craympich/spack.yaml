# Experimental JACI MPAS-JEDI GCC 13 spack.yaml
#
# Purpose
# -------
# Document a possible GCC 13.2 MPAS-JEDI stack target for JACI.
#
# Context
# -------
# This file is intentionally disabled. It must not be used as the production
# JACI spack-stack environment.
#
# The current validated production target is:
#
#   PrgEnv-gnu/8.6.0
#   gcc-native/12.3
#   cray-mpich/8.1.31
#   CrayPE drivers cc, CC and ftn
#
# The GCC 13.2 module exists on JACI, but Cray MPICH still points to the GNU
# 12.3 backend:
#
#   CRAY_MPICH_DIR=/opt/cray/pe/mpich/8.1.31/ofi/gnu/12.3
#   CRAY_MPICH_PREFIX=/opt/cray/pe/mpich/8.1.31/ofi/gnu/12.3
#
# The following path does not exist on JACI:
#
#   /opt/cray/pe/mpich/8.1.31/ofi/gnu/13.2
#
# Validation status
# -----------------
# Not validated.
#
# How to use
# ----------
# Do not concretize this file directly. Use the validated GCC 12 target instead:
#
#   envs/jaci/mpas-jedi-gcc12-craympich/spack.yaml
#
# If a GCC 13.2 target is pursued later, replace the disabled skeleton below
# with a fully validated environment and a confirmed Cray MPICH backend.
#
# Open items
# ----------
# 1. Confirm whether a GNU 13.2 Cray MPICH backend will be provided on JACI.
# 2. Decide whether a hybrid GCC 13.2 + GNU 12.3 Cray MPICH backend is acceptable.
# 3. Run full spack-stack and MONAN/MPAS-JEDI validation before enabling.

# This file is intentionally not a valid active environment.
# Use envs/jaci/mpas-jedi-gcc12-craympich/spack.yaml for the validated target.
