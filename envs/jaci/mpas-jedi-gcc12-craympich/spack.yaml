# JACI MPAS-JEDI spack.yaml for JCSDA spack-stack
#
# Purpose
# -------
# Define the spack-stack environment for MONAN/MPAS-JEDI on JACI using the
# currently validated GCC 12.3 + Cray MPICH target.
#
# Context
# -------
# This file is derived from the validated environment:
#
#   envs/mpas-bundle-jaci-gnu12/spack.yaml
#
# in the discovery JACI spack-stack tree.
#
# The validated target used:
#
#   spack-stack release/2.1
#   PrgEnv-gnu/8.6.0
#   gcc-native/12.3
#   cray-mpich/8.1.31
#   CrayPE compiler drivers cc, CC and ftn
#
# Validation status
# -----------------
# This environment structure was observed in the validated stack. The associated
# MPAS-JEDI validation result was 61/62 tests passing, with one stable numerical
# reference mismatch in `mpasjedi_lgetkf_height_vloc`.
#
# The hashes below document the discovery tree from which this environment was
# extracted:
#
#   spack-stack hash: 4641080
#   spack hash: 324bf79a31
#
# How to use
# ----------
# Copy this file into a JCSDA spack-stack environment directory, activate it and
# concretize manually:
#
#   mkdir -p <spack-stack>/envs/jaci-mpas-jedi-gcc12-craympich
#   cp spack.yaml <spack-stack>/envs/jaci-mpas-jedi-gcc12-craympich/spack.yaml
#   spack env activate <spack-stack>/envs/jaci-mpas-jedi-gcc12-craympich
#   spack concretize -f
#
# Open items
# ----------
# 1. Confirm whether the environment name should remain
#    `jaci-mpas-jedi-gcc12-craympich` or be aligned with the original
#    `mpas-bundle-jaci-gnu12` naming convention.
# 2. Confirm that the `site` and `common` include directories are generated or
#    copied in the expected location when this file is used outside the original
#    discovery tree.

# spack-stack hash: 4641080
# spack hash: 324bf79a31
spack:
  concretizer:
    unify: when_possible
  view: false
  include:
  - site
  - common
  specs:
  - jedi-mpas-env
  bootstrap:
    enable: true
    root: $spack/bootstrap
    sources:
    - name: github-actions-v2
      metadata: $spack/share/spack/bootstrap/github-actions-v2
    - name: github-actions-v0.6
      metadata: $spack/share/spack/bootstrap/github-actions-v0.6
    - name: spack-install
      metadata: $spack/share/spack/bootstrap/spack-install
    trusted:
      github-actions-v2: true
      github-actions-v0.6: true
      spack-install: true
